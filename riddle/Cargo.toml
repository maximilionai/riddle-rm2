[package]
name = "riddle"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "The diary of Tom Riddle, for the reMarkable 2"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
png = "0.17"
ab_glyph = "0.2"
# HTTP + TLS for the OpenAI-compatible oracle backend. Pure Rust (rustls), no
# OpenSSL/C — keeps the binary self-contained and cross-compiles cleanly.
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[features]
# Link libquill.so (vendor e-ink engine C ABI) for full-takeover mode.
# DEAD on the reMarkable 2 — enabling it is a compile error (see display.rs).
takeover = []

[profile.release]
strip = true
lto = true
# One codegen unit lets LTO see the whole crate: the hot loops here are small
# functions called per-pixel (Surface::luma, put_px, stamp), and cross-unit
# inlining is what turns them into real code on a Cortex-A7.
codegen-units = 1
# Nothing catches unwinds, and a panic on the tablet should die loudly rather
# than limp on. Dropping the unwind tables and landing pads also takes a
# noticeable bite out of the binary.
panic = "abort"
